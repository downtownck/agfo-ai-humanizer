<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AGFO AI Humanizer</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13px;color:#1e293b;background:#f8fafc;height:100vh;display:flex;flex-direction:column}
    .hdr{background:#0f172a;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
    .hdr h1{font-size:15px;font-weight:700}
    .hdr-icon{font-size:18px}
    .body{flex:1;overflow-y:auto;padding:12px}
    .section{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px}
    .section-title{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
    label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:4px}
    input,select,textarea{width:100%;border:1.5px solid #cbd5e1;border-radius:8px;padding:8px 10px;font:13px/1.4 inherit;color:#1e293b;background:#fff;outline:none;transition:border-color .2s}
    input:focus,select:focus,textarea:focus{border-color:#1d4ed8}
    textarea{resize:vertical;min-height:90px}
    .provider-tabs{display:flex;gap:4px;margin-bottom:8px}
    .ptab{flex:1;padding:6px 4px;border:1.5px solid #cbd5e1;background:#fff;border-radius:7px;cursor:pointer;font-size:11px;font-weight:700;color:#64748b;text-align:center;transition:all .2s}
    .ptab.active{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
    .mode-btn{border:1.5px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 5px;cursor:pointer;font-size:11px;font-weight:700;color:#334155;text-align:center;transition:all .2s}
    .mode-btn.active{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
    .mode-btn:hover:not(.active){background:#f1f5f9}
    .mode-btn:disabled{opacity:.65;cursor:wait}
    .btn{width:100%;padding:9px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700;transition:all .2s;margin-top:6px}
    .btn-primary{background:#1d4ed8;color:#fff}
    .btn-primary:hover{background:#1e40af}
    .btn-primary:disabled{opacity:.65;cursor:wait}
    .btn-secondary{background:#f1f5f9;color:#334155;border:1.5px solid #cbd5e1}
    .btn-secondary:hover{background:#e2e8f0}
    .hint{font-size:12px;line-height:1.45;background:#fffbeb;border:1px solid #fbbf24;color:#92400e;border-radius:8px;padding:9px;margin-top:8px}
    .status{font-size:11px;padding:7px 10px;border-radius:7px;margin-top:8px;display:none;line-height:1.45}
    .status.info{background:#eff6ff;color:#1d4ed8;display:block}
    .status.error{background:#fef2f2;color:#dc2626;display:block}
    .status.success{background:#f0fdf4;color:#16a34a;display:block}
    .spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>

<body>
  <div class="hdr">
    <span class="hdr-icon">&#x1F9E0;</span>
    <h1>AGFO AI Humanizer</h1>
  </div>

  <div class="body">

    <div class="section">
      <div class="section-title">&#x2699;&#xFE0F; API Ayarları</div>

      <div class="provider-tabs">
        <button class="ptab active" data-provider="openrouter">OpenRouter</button>
        <button class="ptab" data-provider="openai">OpenAI</button>
        <button class="ptab" data-provider="claude">Claude</button>
        <button class="ptab" data-provider="gemini">Gemini</button>
      </div>

      <div id="api-openrouter">
        <label>OpenRouter API Key</label>
        <input type="password" id="key-openrouter" placeholder="sk-or-..."/>
        <label style="margin-top:8px">Model</label>
        <select id="model-openrouter"></select>
      </div>

      <div id="api-openai" style="display:none">
        <label>OpenAI API Key</label>
        <input type="password" id="key-openai" placeholder="sk-..."/>
        <label style="margin-top:8px">Model</label>
        <select id="model-openai"></select>
      </div>

      <div id="api-claude" style="display:none">
        <label>Claude API Key</label>
        <input type="password" id="key-claude" placeholder="sk-ant-..."/>
        <label style="margin-top:8px">Model</label>
        <select id="model-claude"></select>
      </div>

      <div id="api-gemini" style="display:none">
        <label>Gemini API Key</label>
        <input type="password" id="key-gemini" placeholder="AIza..."/>
        <label style="margin-top:8px">Model</label>
        <select id="model-gemini"></select>
      </div>

      <button class="btn btn-secondary" id="btn-refresh-models" style="margin-top:8px">&#x1F504; Modelleri Yenile</button>
      <button class="btn btn-secondary" id="btn-save-key" style="margin-top:5px">&#x1F4BE; Ayarları Kaydet</button>

      <div class="status info" id="model-status" style="margin-top:8px;display:none"></div>
    </div>

    <div class="section">
      <div class="section-title">&#x1F4DD; Seçili Metin</div>

      <label>Dil</label>
      <select id="lang-select">
        <option value="Turkish">Türkçe</option>
        <option value="English">English</option>
        <option value="German">Deutsch</option>
        <option value="French">Français</option>
        <option value="Spanish">Español</option>
      </select>

      <div class="hint">
        Word içinde metni seçin. Aşağıdaki modlardan birine bastığınızda seçili metin doğrudan AI çıktısıyla değiştirilir.
      </div>
    </div>

    <div class="section">
      <div class="section-title">&#x1F3DB;&#xFE0F; Mod</div>

      <div class="mode-grid">
        <button class="mode-btn" data-mode="OTO">&#x1F916; OTO</button>
        <button class="mode-btn" data-mode="GENEL">&#x270D;&#xFE0F; Genel</button>
        <button class="mode-btn" data-mode="YAPISAL">&#x1F3D7;&#xFE0F; Yapısal</button>
        <button class="mode-btn" data-mode="TON">&#x1F399;&#xFE0F; Ton</button>
        <button class="mode-btn" data-mode="AKADEMIK">&#x1F393; Akademik</button>
        <button class="mode-btn" data-mode="KELIME">&#x1F524; Kelime</button>
        <button class="mode-btn" data-mode="KATMANLI">&#x1F9C5; Katmanlı</button>
        <button class="mode-btn" data-mode="BURST">&#x26A1; Burst</button>
        <button class="mode-btn" data-mode="CGK_DRAMA">&#x1F300; CGK Drama</button>
        <button class="mode-btn" data-mode="CGK_AKADEMIK">&#x1F4D0; CGK Akademik</button>
        <button class="mode-btn" data-mode="SIMPLE">&#x1F9F9; Simple</button>
        <button class="mode-btn" data-mode="KUPKURU">&#x1FA93; Kupkuru</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">&#x1F4AC; Seçili Metne Talimat</div>

      <label>Özel talimat</label>
      <textarea id="custom-instruction" placeholder="Örn: Daha kısa yap, daha resmi yaz, karakter sesini koru, denetçi diliyle sadeleştir..."></textarea>

      <button class="btn btn-primary" id="btn-apply-instruction">&#x1F527; Talimatı Seçili Metne Uygula</button>
    </div>

    <div class="status" id="status-msg"></div>

  </div>

  <script src="taskpane.js?v=4.1.0"></script>
</body>
</html>
